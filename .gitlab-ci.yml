workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - quality
  - dockerize

variables:
  # Keep the image in sync with .nvmrc and docker/Dockerfile.
  NODE_IMAGE: node:26.13.1-alpine
  PNPM_STORE_DIR: .pnpm-store
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

quality:
  stage: quality
  image: $NODE_IMAGE
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  variables:
    NEXT_PUBLIC_APP_ENV: production
    NEXT_PUBLIC_APP_URL: http://localhost:3000
  before_script:
    - npm install --global --ignore-scripts --no-audit --no-fund --no-update-notifier "$(node -p "require('./package.json').packageManager")"
    - pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
  script:
    - pnpm verify
    - pnpm test:coverage
    - pnpm build-storybook
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    expire_in: 1 day
    paths:
      - .next/standalone
      - .next/static
      - storybook-static

# This publishing job needs a runner that supports rootless BuildKit.
# Replace or remove the JSONPlaceholder build argument when removing the posts demo.
dockerize:
  stage: dockerize
  image:
    name: moby/buildkit:v0.35.1-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p "$HOME/.docker"
    - |
      auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > "$HOME/.docker/config.json"
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context="$CI_PROJECT_DIR"
      --local dockerfile="$CI_PROJECT_DIR/docker"
      --opt build-arg:NEXT_PUBLIC_APP_ENV="${NEXT_PUBLIC_APP_ENV:-production}"
      --opt build-arg:NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      --opt build-arg:NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://jsonplaceholder.typicode.com}"
      --output "type=image,\"name=$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA},$CI_REGISTRY_IMAGE:latest\",push=true"
